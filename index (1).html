<script>
/* ---------- constants and state ---------- */
const FKEY='azy.fruitpos.v4',IDBN='azy-fruits',IDBS='state',IDBK='main';
/* ONLINE SETUP: paste your Supabase Project URL and public (anon / publishable) key between the quotes. */
const SB_URL='https://ngxhjfefguihjrtblncp.supabase.co',SB_KEY='sb_publishable_NfpagKRtPPIzdKMjgL2UlQ_kEMtfwV0';
const CLOUD=!SB_URL.includes('PASTE')&&!SB_KEY.includes('PASTE');
const METHODS=['CASH','GCASH','BANK'],FULL=['CASH','GCASH','BANK'];
const MODES=[['CASH','CASH'],['GCASH','GCASH'],['BANK','BANK'],['CREDIT','CREDIT (UNPAID)'],['PARTIAL','PARTIAL PAYMENT']];
const modeLabel=m=>(MODES.find(x=>x[0]==m)||[0,String(m||'')])[1];
const BUILTIN=['MANGO','GRAPES','BANANA','APPLE','ORANGE','WATERMELON','PINEAPPLE','PAPAYA','PEAR','LEMON','LIME','KIWI','STRAWBERRY','DRAGON FRUIT','MELON','CANTALOUPE','HONEYDEW','AVOCADO','COCONUT','DURIAN','LANZONES','RAMBUTAN','MANGOSTEEN','POMELO','GUAVA','CALAMANSI','PEACH','PLUM','CHERRY','BLUEBERRY','POMEGRANATE','LYCHEE','SANTOL','JACKFRUIT','DATES','FIG','TANGERINE','MANDARIN','CHICO','ATIS','GUYABANO','PERSIMMON','APRICOT','NECTARINE','GRAPEFRUIT','PASSION FRUIT'];
const fresh=()=>({v:4,fruits:[],sizes:[],custs:[],stockIn:[],orders:[],adj:[],pays:[],prices:{},seq:1,seqO:1,overdue:7});
let db=fresh(),idb=null,usingLS=false,committing=false,_pm=null,rev=0,sess=null,localSeed=null;
let view='dash',per='week',cart=[],rcart=[],curCust='',curMode='',curVia='CASH',curPaid='',touched=false,editId=null,DT0='',recEdit=null,payBusy=false;
const F={ord:'today',rec:'today',cus:'all'},UT={status:'active',from:'',to:''};
const $=id=>document.getElementById(id);
/* ---------- helpers ---------- */
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const r2=n=>Math.round((+n||0)*100)/100;
const peso=n=>'₱'+(+n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>(+n||0).toLocaleString('en-PH',{maximumFractionDigits:2});
const short=v=>'₱'+(v>=1000?(v/1000).toFixed(v>=10000?0:1).replace('.0','')+'k':Math.round(v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=t=>new Date(t).toLocaleDateString('en-CA');
const TM=t=>new Date(t).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'});
const DT=t=>new Date(t).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})+', '+TM(t);
const today=()=>D(Date.now()),ago=n=>D(Date.now()-n*864e5);
const longD=d=>new Date(d+'T12:00').toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
const lab=d=>d==today()?'Today':d==ago(1)?'Yesterday':'';
const tsOn=d=>d==today()?Date.now():new Date(d+'T'+new Date().toTimeString().slice(0,8)).getTime();
const daysSince=ts=>Math.round((new Date(today()+'T12:00')-new Date(D(ts)+'T12:00'))/864e5);
const toLocalInput=ts=>{const n=new Date(ts),p=x=>String(x).padStart(2,'0');return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+'T'+p(n.getHours())+':'+p(n.getMinutes())};
const normName=s=>String(s??'').toUpperCase().replace(/\s+/g,' ').trim();
const blank=v=>v===undefined||v===null||v===''||isNaN(+v)?'':+v;
const chan=m=>{const u=String(m||'').toUpperCase();return METHODS.includes(u)?u:'CASH'};
function addTo(l,v){if(v&&!l.some(x=>x.toLowerCase()==v.toLowerCase()))l.push(v)}
const canon=(l,v)=>l.find(x=>x.toLowerCase()==v.toLowerCase())||v;
const lt=l=>l.boxes*l.price,ot=o=>sum(o.lines,lt),nm=x=>x.fruit+(x.size?' ('+x.size+')':'');
const ref=o=>'ORD-'+String(o.no).padStart(4,'0');
const ordById=id=>db.orders.find(o=>o.id===id);
const pm=()=>_pm||(_pm=db.pays.reduce((m,p)=>((m[p.orderId]=m[p.orderId]||[]).push(p),m),{}));
const lateList=o=>pm()[o.id]||[],lateOf=o=>sum(lateList(o),p=>p.amt);
const paidOf=o=>r2(o.paid+lateOf(o)),balOf=o=>Math.max(0,r2(ot(o)-paidOf(o)));
const stOf=o=>balOf(o)<=0.005?'PAID':paidOf(o)>0.005?'PARTIALLY PAID':'UNPAID';
const stCls=s=>s=='PAID'?'':s=='PARTIALLY PAID'?'low':'out';
const stTag=o=>{const s=stOf(o);return `<span class="tag ${stCls(s)}">${s}</span>`};
const custs=()=>[...new Set(db.orders.map(o=>o.cust))];
const cbal=c=>sum(db.orders.filter(o=>o.cust===c),balOf);
const lastPay=o=>{const l=lateList(o).map(p=>p.ts);if(o.paid>0)l.push(o.ts);return l.length?Math.max(...l):null};
const payLabel=o=>o.mode=='PARTIAL'?'PARTIAL PAYMENT ('+o.method+')':modeLabel(o.mode);
const qtyTxt=l=>[num(l.boxes)+' BOXES',+l.kg>0?num(l.kg)+' KG':'',+l.pcs>0?num(l.pcs)+' PCS':''].filter(Boolean).join(' · ');
const cartTotal=()=>sum(cart,lt);
const curLate=()=>editId?lateOf(ordById(editId)||{id:-1}):0;
/* ---------- fruit name checking ---------- */
const allFruits=()=>[...new Set([...BUILTIN,...db.fruits,...(view=='receive'?rcart.map(l=>l.fruit):[])])];
const K=s=>s.replace(/[^\p{L}]/gu,'');
const validFruit=n=>(n.match(/\p{L}/gu)||[]).length>=2;
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;const d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=1;j<=n;j++)d[0][j]=j;
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const c=a[i-1]==b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]==b[j-2]&&a[i-2]==b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
function resolveFruit(raw){
 const n=normName(raw),L=allFruits(),kn=K(n);
 if(L.includes(n))return{ok:n};
 const same=L.find(f=>K(f)==kn);if(same)return{ok:same};
 const sc=L.map(f=>({f,d:lev(K(f),kn)})).sort((a,b)=>a.d-b.d||a.f.length-b.f.length);

  const lines=src.map(l=>({fruit:U(l.fruit),size:U(l.size),boxes:+l.boxes||0,kg:blank(l.kg),pcs:blank(l.pcs),price:+l.price||0}));

  try{sess=await authCall('refresh_token',{refresh_token:sess.refresh});saveSess(sess)}
  catch(e){if(e instanceof TypeError)throw new Error('No internet connection');sess=null;saveSess(null);throw new Error('Session expired. Sign in again.')}}

 const fruit=await pickFruit(rawF,true);if(fruit===null){$('rf').focus();return}
 if(fruit===''){bad('rf','Enter a valid fruit name.');focusFirst();return}
 const size=canon(db.sizes,normName($('rs').value));
 rcart.push({fruit,size,boxes:+b,kg:k===''?'':+k,cost:c===''?'':+c});
 ['rf','rb','rs','rk','rc'].forEach(id=>$(id).value='');refreshRcart();$('rf').focus()}
async function saveDelivery(){
 if(committing)return;clearErrs();let first=null;const E=(id,m)=>{bad(id,m);first=first||id};
 const d=$('rd').value;
 if($('rf').value.trim()||$('rb').value!==''||$('rs').value.trim()||$('rk').value!==''||$('rc').value!=='')E('rf','Click Add to include this fruit, or clear it.');
 if(!rcart.length)$('rcartbox').classList.add('bad');
 if(!d)E('rd','Pick the arrival date.');else if(d>today())E('rd','Date cannot be in the future.');
 if(first||!rcart.length){first?focusFirst():$('rcartbox').scrollIntoView({block:'center',behavior:'smooth'});return}
 const ts=tsOn(d),lines=rcart.map(l=>({...l})),tb=sum(lines,l=>l.boxes);
 const ok=await commit(()=>{lines.forEach(l=>{addTo(db.fruits,l.fruit);addTo(db.sizes,l.size);db.stockIn.push({id:db.seq++,ts,fruit:l.fruit,size:l.size,boxes:l.boxes,kg:l.kg,cost:l.cost})})},lines.length+' fruit'+(lines.length==1?'':'s')+' ('+num(tb)+' boxes) added to stock',()=>saveDelivery());
 if(ok){rcart=[];render()}}
function editRec(id){recEdit=id;render();window.scrollTo(0,0)}
function cancelRec(){recEdit=null;render()}
async function delRec(id){const r=db.stockIn.find(x=>x.id===id);if(!r)return;
 const trial=trialDb(t=>{t.stockIn=t.stockIn.filter(x=>x.id!==id)});
 if(itemsOf(trial).find(x=>x.left<-1e-9&&x.fruit==r.fruit&&x.size==r.size)){toast('Those boxes are already sold, so this delivery cannot be deleted.');return}
 if(!await ask('Delete this delivery?',`<b>${num(r.boxes)}</b> boxes of <b>${esc(nm(r))}</b> received ${DT(r.ts)} will be removed from stock.`,'Delete',true))return;
 if(await commit(()=>{db.stockIn=db.stockIn.filter(x=>x.id!==id)},'Delivery deleted',()=>delRec(id))){if(recEdit===id)recEdit=null;render()}}
/* ----- customers ----- */
let CU='all';
function showUnpaid(){CU='owe';go('cust')}
function setCU(v){CU=v;render()}
function customersView(){
 const owe=CU=='owe',od=o=>balOf(o)>0.005&&daysSince(o.ts)>=db.overdue;
 const nOwe=custs().filter(c=>cbal(c)>0.005).length;
 const cs=custs().map(c=>({c,os:db.orders.filter(o=>o.cust===c&&(owe?balOf(o)>0.005:inF('cus',o.ts))).sort((a,b)=>owe?a.ts-b.ts||a.id-b.id:b.ts-a.ts||b.id-a.id)})).filter(x=>x.os.length).sort(owe?(a,b)=>cbal(b.c)-cbal(a.c):(a,b)=>b.os[0].ts-a.os[0].ts);
 const all=cs.flatMap(x=>x.os);
 const toggle=`<div class="flt"><button class="${owe?'o':'p'}" onclick="setCU('all')">All customers</button><button class="${owe?'p':'o'}" onclick="setCU('owe')">Unpaid (${nOwe})</button>${owe?`<div class="fld" style="min-width:150px;max-width:190px"><label>Overdue after (days)</label><input type="number" min="1" step="1" value="${db.overdue}" onchange="setOverdue(this.value)"></div>`:''}</div>`;
 const kpi=owe?`<div class="kpi"><div><span>Total outstanding</span><b class="owe">${peso(sum(cs,x=>cbal(x.c)))}</b></div><div><span>Customers with unpaid</span><b>${cs.length}</b></div><div><span>Unpaid orders</span><b>${all.length}</b></div><div><span>Overdue (${db.overdue}+ days)</span><b class="owe">${peso(sum(all.filter(od),balOf))}</b></div></div>`
 :`<div class="kpi"><div><span>Customers shown</span><b>${cs.length}</b></div><div><span>Purchases</span><b class="hl">${peso(sum(all,ot))}</b><small>${all.length} order${all.length==1?'':'s'}</small></div><div><span>Paid</span><b class="paidc">${peso(sum(all,paidOf))}</b></div><div><span>Outstanding (all their orders)</span><b class="owe">${peso(sum(cs,x=>cbal(x.c)))}</b></div></div>`;
 return head('Customers & unpaid','Every purchase with who bought it, when, what, how much was paid and what is still owed. Use "Unpaid" to see only unpaid orders and record payments.')+toggle+(owe?'':filt('cus'))+kpi+
 (cs.length?cs.map(({c,os})=>{const b=cbal(c),ps=payRows(c).filter(p=>owe||inF('cus',p.ts));
 return `<details class="c"${owe||F.cus!='all'?' open':''}><summary><b style="font-size:17px">${esc(c)}</b><span class="sub" style="margin:0">${os.length} order${os.length==1?'':'s'}, <b class="hl">${peso(sum(os,ot))}</b> total, <b class="paidc">${peso(sum(os,paidOf))}</b> paid</span>${b>0.005?`<span class="tag out">Owes ${peso(b)} in total</span>`:'<span class="tag">Paid up</span>'}</summary>
 ${os.map(o=>`<div class="grp"><div class="gh"><b>${ref(o)}</b><span>${DT(o.ts)}</span><span>Total <b class="hl">${peso(ot(o))}</b></span><span>Paid <b class="paidc">${peso(paidOf(o))}</b></span><span>${payLabel(o)}</span><span>Balance <b class="${balOf(o)>0.005?'owe':''}">${peso(balOf(o))}</b></span>${stTag(o)}${od(o)?`<span class="tag out">Overdue ${daysSince(o.ts)} days</span>`:''}${balOf(o)>0.005?`<span class="push"><button class="p" onclick="payModal(${o.id})">Record payment</button></span>`:''}</div>
 <div class="sc"><table><tr><th>Fruit</th><th>Size</th><th class="n">Boxes</th><th class="n">Kg</th><th class="n">Pcs</th><th class="n">Price</th><th class="n">Amount</th></tr>${o.lines.map(l=>`<tr><td>${esc(l.fruit)}</td><td>${esc(l.size)||'-'}</td><td class="n">${num(l.boxes)}</td><td class="n">${l.kg===''?'-':num(l.kg)}</td><td class="n">${l.pcs===''?'-':num(l.pcs)}</td><td class="n">${peso(l.price)}</td><td class="n">${peso(lt(l))}</td></tr>`).join('')}</table></div></div>`).join('')}
 <h4>Payment history</h4>${ps.length?`<div class="sc"><table><tr><th>Date and time</th><th>Order</th><th class="n">Amount</th><th>Method</th><th>Type</th></tr>${ps.map(p=>`<tr><td>${DT(p.ts)}</td><td>${ref(p.o)}</td><td class="n paidc">${peso(p.amt)}</td><td>${p.method}</td><td>${p.kind}</td></tr>`).join('')}</table></div>`:'<div class="empty">No payments in this view.</div>'}</details>`}).join(''):`<div class="c empty">${owe?'Nobody owes you.':db.orders.length?'No purchases for this date.':'Customers appear here after you save an order.'}</div>`)}
async function setOverdue(v){const n=Math.max(1,Math.round(+v||7));if(await commit(()=>{db.overdue=n},'',()=>setOverdue(v)))render()}
function payModal(id){const o=ordById(id);if(!o)return;const b=balOf(o);
 modal(`<h3>Record payment</h3><div class="sumbox"><div><span>Customer</span><b>${esc(o.cust)}</b></div><div><span>Order</span><span>${ref(o)}</span></div><div><span>Total</span><span>${peso(ot(o))}</span></div><div><span>Already paid</span><span class="paidc">${peso(paidOf(o))}</span></div><div><span>Balance</span><b class="owe">${peso(b)}</b></div></div>
 <div class="form" style="grid-template-columns:1fr 1fr">
 <div class="fld"><label>Amount <span class="req">*</span></label><input id="pa" type="number" min="0" step="any" inputmode="decimal" value="${b}" data-af><div class="err"></div></div>
 <div class="fld"><label>Payment date <span class="req">*</span></label><input id="pd" type="date" value="${today()}" min="${D(o.ts)}" max="${today()}"><div class="err"></div></div>
 <div class="fld wide"><label>Paid with</label><select id="pw">${METHODS.map(m=>`<option>${m}</option>`).join('')}</select></div></div>
 <div class="mf"><button class="o" onclick="closeModal(null)">Cancel</button><button class="p" id="pbtn" onclick="savePay(${id})">Save payment</button></div>`)}
async function savePay(id){
 if(payBusy||committing)return;const o=ordById(id);if(!o)return;clearErrs();let first=null;const E=(i,m)=>{bad(i,m);first=first||i};
 const b=balOf(o),aRaw=$('pa').value,a=r2(aRaw),d=$('pd').value;
 if(aRaw===''||isNaN(+aRaw)||!(a>0))E('pa','Enter an amount above 0.');else if(a>b+0.005)E('pa','More than the balance of '+peso(b)+'.');
 if(!d)E('pd','Pick the payment date.');else if(d>today())E('pd','Date cannot be in the future.');else if(d<D(o.ts))E('pd','Date is before the order date.');
 if(first){$(first).focus();return}
 payBusy=true;$('pbtn').disabled=true;const method=$('pw').value,ts=Math.max(tsOn(d),o.ts);
 const ok=await commit(()=>{if(a>balOf(ordById(id))+0.005)throw new Error('Balance changed');db.pays.push({id:db.seq++,ts,orderId:id,cust:o.cust,amt:a,method})},'Payment recorded',()=>savePay(id));
 payBusy=false;if(ok){closeModal(true);render()}else if($('pbtn'))$('pbtn').disabled=false}
/* ----- reports ----- */
function reportsView(){
 const t=today(),ok=ts=>per=='all'||(per=='today'?D(ts)==t:per=='week'?D(ts)>=ago(6):D(ts).startsWith(t.slice(0,7)));
 const os=db.orders.filter(o=>ok(o.ts)),cl=coll(ok),cm={};itemsOf(db).forEach(x=>cm[x.fruit+'|'+x.size]=avg(x));
 const g={};os.flatMap(o=>o.lines).forEach(l=>{const k=l.fruit+'|'+l.size,x=g[k]=g[k]||{fruit:l.fruit,size:l.size,b:0,kg:0,a:0,p:0,known:false};x.b+=l.boxes;x.kg+=+l.kg||0;x.a+=lt(l);if(cm[k]!=null){x.known=true;x.p+=(l.price-cm[k])*l.boxes}});
 const rows=Object.values(g).sort((a,b)=>b.a-a.a);
 return head('Reports','Sales, profit and money collected.')+`<div class="form" style="max-width:240px;margin-bottom:14px"><div class="fld"><label>Period</label><select onchange="per=this.value;render()">${[['today','Today'],['week','Last 7 days'],['month','This month'],['all','All time']].map(([v,l])=>`<option value="${v}"${per==v?' selected':''}>${l}</option>`).join('')}</select></div></div>
 <div class="kpi"><div><span>Sales</span><b class="hl">${peso(sum(os,ot))}</b><small>${os.length} orders, ${num(sum(os.flatMap(o=>o.lines),l=>l.boxes))} boxes</small></div>
 <div><span>Profit</span><b>${peso(profit(os))}</b><small>Fruits with a cost price only</small></div>
 <div><span>Collected</span><b class="paidc">${peso(sum(METHODS,m=>cl[m]))}</b><small>Cash ${short(cl.CASH)}, GCash ${short(cl.GCASH)}, Bank ${short(cl.BANK)}</small></div>
 <div><span>Owed by customers now</span><b class="owe">${peso(sum(custs(),cbal))}</b></div></div>
 <div class="c"><h3>Sales by fruit</h3>${rows.length?`<div class="sc"><table><tr><th>Fruit</th><th>Size</th><th class="n">Boxes</th><th class="n">Kg</th><th class="n">Sales</th><th class="n">Profit</th></tr>${rows.map(x=>`<tr><td>${esc(x.fruit)}</td><td>${esc(x.size)||'-'}</td><td class="n">${num(x.b)}</td><td class="n">${x.kg?num(x.kg):'-'}</td><td class="n hl">${peso(x.a)}</td><td class="n">${x.known?peso(x.p):'-'}</td></tr>`).join('')}</table></div>`:'<div class="empty">No sales in this period.</div>'}</div>`}
/* ---------- backup, restore, export ---------- */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
const stamp=()=>{const n=new Date(),p=x=>String(x).padStart(2,'0');return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+'_'+p(n.getHours())+p(n.getMinutes())+p(n.getSeconds())};
const counts=d=>`${d.orders.length} orders, ${d.stockIn.length} deliveries, ${d.pays.length} later payments, ${new Set(d.orders.map(o=>o.cust)).size} customers`;
function backup(){try{
 const payload={app:'AZY_FRUITS_POS',version:4,createdAt:new Date().toISOString(),summary:counts(db),data:db,
  customers:custs().map(c=>({name:c,orders:db.orders.filter(o=>o.cust===c).map(ref),outstanding:cbal(c)})),inventory:itemsOf(db).map(x=>({fruit:x.fruit,size:x.size,inStock:x.left}))};
 const name='FRUIT_POS_BACKUP_'+stamp()+'.json';dl(name,JSON.stringify(payload),'application/json');
 try{localStorage.setItem('azy.lastbackup',today())}catch(e){}toast('Backup file created: '+name);if(view=='dash')render();return true}
 catch(e){toast('Backup failed. '+(e.message||''),()=>backup());return false}}
function csvOrders(){const h=['Ref','Date','Time','Customer','Fruit','Size','Boxes','Kg','Pieces','Price','Amount','Order total','Order paid','Balance','Status','Payment type'];
 dl('azy-orders-'+stamp()+'.csv',[h.join(','),...db.orders.flatMap(o=>o.lines.map(l=>[q(ref(o)),D(o.ts),q(TM(o.ts)),q(o.cust),q(l.fruit),q(l.size),l.boxes,l.kg,l.pcs,l.price,lt(l),ot(o),paidOf(o),balOf(o),q(stOf(o)),q(payLabel(o))].join(',')))].join('\n'),'text/csv')}
$('rfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 let inc,meta='';
 try{const j=JSON.parse(await f.text()),raw=j&&j.data&&Array.isArray(j.data.orders)?j.data:j;if(!raw||!Array.isArray(raw.orders)||!Array.isArray(raw.stockIn))throw 0;inc=normalize(raw);meta=j.createdAt?DT(j.createdAt):''}
 catch(x){toast('That file is not a valid backup.');return}
 if(new Set(inc.orders.map(o=>o.id)).size!=inc.orders.length){toast('Backup has duplicate order IDs. Not restored.');return}
 const v=await modal(`<h3>Restore backup?</h3><p><b>This replaces all current data.</b> Orders, deliveries and payments that are not in the backup file will be lost.</p><div class="sumbox"><div><span>Now</span><span>${counts(db)}</span></div><div><span>Backup${meta?' ('+meta+')':''}</span><b>${counts(inc)}</b></div></div><label class="cvg"><input type="checkbox" id="rsafe" checked> Download a copy of the current data first</label><div class="mf"><button class="o" onclick="closeModal(null)">Cancel</button><button class="d2" onclick="closeModal($('rsafe').checked?'safe':'go')">Restore</button></div>`);
 if(!v)return;if(v=='safe'&&!backup())return;
 if(await commit(()=>{db=inc},'Backup restored',()=>$('rfile').click())){resetOrderForm();rcart=[];recEdit=null;render()}};
/* ---------- start ---------- */
(async function(){applyTheme(document.documentElement.dataset.theme=='dark'?'dark':'light');$('app').innerHTML='<div class="empty">Loading…</div>';
 await init();if(!CLOUD)render();let lastDay=today();setInterval(()=>{if(today()!=lastDay){lastDay=today();if(!mres&&(!CLOUD||sess))render()}},30000)})();
</script></body></html>
